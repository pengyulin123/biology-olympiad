<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · 生物竞赛作战台</title>
<style>
  :root { --bg:#070b0d; --text:#e8f0ee; --dim:#92a5a1; --faint:#63756f; --mint:#21e6a6; --line:rgba(255,255,255,.16); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(800px 500px at 15% -10%, rgba(33,230,166,.12), transparent 65%), var(--bg);
    color: var(--text); font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    text-align: center; padding: 24px;
  }
  .n { font-family: "SF Mono",Menlo,Consolas,monospace; font-size: 68px; font-weight: 800; color: var(--mint); opacity: .22; line-height: 1; }
  h1 { font-size: 21px; margin: 14px 0 8px; font-weight: 700; }
  p { font-size: 13.5px; color: var(--dim); line-height: 1.8; margin: 0 0 10px; }
  .btns { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  a.b {
    display: inline-block; padding: 10px 20px; border-radius: 11px; font-size: 14px;
    font-weight: 600; text-decoration: none; border: 1px solid var(--line); color: var(--text);
  }
  a.p { background: var(--mint); border-color: var(--mint); color: #04110c; }
  .f { font-size: 12px; color: var(--faint); margin-top: 26px; }
  .f a { color: var(--dim); }
</style>
</head>
<body>
  <div style="max-width:420px">
    <div class="n">404</div>
    <h1>这个页面不存在</h1>
    <p>地址可能拼错了，或者这个页面已经合并进别的标签页。</p>
    <div class="btns">
      <a class="b p" href="/">回首页</a>
      <a class="b" href="/knowledge.html">知识总纲</a>
    </div>
    <p class="f">
      旧版的 race / map / resources 已合并进 <a href="/guide.html">指南</a>。<br>
      如果这里样式正常但按钮点不到，说明站点部署在子路径下，请从首页进入。
    </p>
  </div>
  <script>
    // 子路径部署时把根相对地址修正为相对地址
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      if (parts.length < 1) return;
      // 首个路径段通常是仓库名，用它拼相对根
      var base = parts[0] + "/";
      if (/(index|knowledge|guide|plan|drill)\.html$/.test(location.pathname)) return;
      document.querySelectorAll('a[href^="/"]').forEach(function (a) {
        var p = a.getAttribute("href").replace(/^\//, "");
        a.setAttribute("href", "/" + base + p);
      });
    })();
  </script>
</body>
</html>
